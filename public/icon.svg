<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#b6ff00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Neon Clock Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="176" fill="#030712" fill-opacity="0.6" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Hour Ticks -->
  <circle cx="256" cy="96" r="6" fill="#b6ff00" />
  <circle cx="416" cy="256" r="6" fill="#b6ff00" />
  <circle cx="256" cy="416" r="6" fill="#b6ff00" />
  <circle cx="96" cy="256" r="6" fill="#b6ff00" />

  <!-- Minor Ticks -->
  <circle cx="336" cy="117" r="3" fill="#64748b" />
  <circle cx="395" cy="176" r="3" fill="#64748b" />
  <circle cx="395" cy="336" r="3" fill="#64748b" />
  <circle cx="336" cy="395" r="3" fill="#64748b" />
  <circle cx="176" cy="395" r="3" fill="#64748b" />
  <circle cx="117" cy="336" r="3" fill="#64748b" />
  <circle cx="117" cy="176" r="3" fill="#64748b" />
  <circle cx="176" cy="117" r="3" fill="#64748b" />

  <!-- Weather Sun Icon Accent (Top Right) -->
  <circle cx="330" cy="180" r="24" fill="#f59e0b" filter="url(#glow)" />
  <circle cx="330" cy="180" r="32" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,6" opacity="0.8" />

  <!-- Clock Hands -->
  <!-- Hour hand pointing to 10 o'clock -->
  <line x1="256" y1="256" x2="166" y2="176" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <!-- Minute hand pointing to 2 o'clock -->
  <line x1="256" y1="256" x2="330" y2="200" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <!-- Center Pivot Cap -->
  <circle cx="256" cy="256" r="14" fill="#b6ff00" stroke="#020617" stroke-width="4" />
</svg>
